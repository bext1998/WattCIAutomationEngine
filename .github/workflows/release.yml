name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build watt.exe
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .\scripts\build.ps1 -Version $env:RELEASE_TAG

      - name: Upload watt.exe
        uses: actions/upload-artifact@v7.0.1
        with:
          name: watt-exe
          path: dist/watt.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download watt.exe
        uses: actions/download-artifact@v8.0.1
        with:
          name: watt-exe
          path: dist

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # semver 慣例：tag 帶有 -prerelease 識別碼（例如 v0.0.2-snapshot、
          # v1.0.0-rc1）才標成 pre-release；沒有連字號的正式版 tag（例如
          # v1.0.0）維持一般 release，不需要每次手動指定。
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '.\dist\watt.exe', '--title', $env:RELEASE_TAG, '--generate-notes')
          if ($env:RELEASE_TAG -match '-') {
            $releaseArgs += '--prerelease'
          }
          gh @releaseArgs
